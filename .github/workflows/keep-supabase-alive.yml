name: Keep Supabase Alive

# Supabase free tier pauses projects after ~7 days without API activity.
# This workflow pings the project once a day so it stays online.
# (The /auth/v1/health endpoint returns 401 without a key — that still counts
# as project activity, which is all we need.)

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC, off-peak
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://jedjkfajpwyyuimwbbqv.supabase.co/auth/v1/health" || echo "000")
          echo "Supabase health endpoint responded: HTTP $CODE (401 = project is alive)"
          if [ "$CODE" = "000" ]; then exit 1; fi
